name: TypeScript Release

on:
  push:
    tags:
      - 'release/js/*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.11.1'

    - name: Install Dependencies
      run: npm ci
      working-directory: ./sdk/js/packages/client

    - name: Run Linter
      run: npm run lint
      working-directory: ./sdk/js/packages/client

    - name: Check Format
      run: npm run check-format
      working-directory: ./sdk/js/packages/client

    - name: Build
      run: npm run build
      working-directory: ./sdk/js/packages/client

    - name: Test
      run: npm test
      working-directory: ./sdk/js/packages/client

    - name: Set Version
      run: |
          version=${GITHUB_REF#refs/tags/release/js/}
          npm pkg set version="${version}"
      working-directory: ./sdk/js/packages/client

    - name: Pack
      run: npm pack
      working-directory: ./sdk/js/packages/client

    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: npm-package
        path: ./sdk/js/packages/client/*.tgz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: npm-package
        path: ./packages/

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token}}
      run: |
        tag_name=${GITHUB_REF#refs/tags/}
        version=${tag_name#release/js/}
        gh release create $tag_name -t "Typescript Release $version" ./packages/*.tgz      
