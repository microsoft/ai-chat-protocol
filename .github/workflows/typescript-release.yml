name: TypeScript Release

on:
  push:
    tags:
      - 'release/js/*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.11.1'

    - name: Install Dependencies
      run: npm ci
      working-directory: ./sdk/js/packages/client

    - name: Run Linter
      run: npm run lint
      working-directory: ./sdk/js/packages/client

    - name: Check Format
      run: npm run check-format
      working-directory: ./sdk/js/packages/client

    - name: Build
      run: npm run build
      working-directory: ./sdk/js/packages/client

    - name: Test
      run: npm test
      working-directory: ./sdk/js/packages/client

    - name: Set Version
      run: |
          version=${GITHUB_REF#refs/tags/release/js/}
          npm pkg set version="${version}"
      working-directory: ./sdk/js/packages/client

    - name: Pack
      run: npm pack
      working-directory: ./sdk/js/packages/client

    - name: Upload Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: npm-package
        path: ./sdk/js/packages/client/*.tgz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download Artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: npm-package
        path: ./packages/

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token}}
      run: |
        tag_name=${GITHUB_REF#refs/tags/}
        version=${tag_name#release/js/}
        gh release create $tag_name -t "Typescript Release $version" ./packages/*.tgz      
